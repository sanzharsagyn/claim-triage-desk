name = "sanzhar"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
# Maximum number of model calls per day across all visitors. With Claude Haiku 5.5 one call costs about a tenth of a cent.
DAILY_LIMIT = "200"

# Cache, rate limits and the daily budget counter. Wrangler creates the namespace on the first deploy.
[[kv_namespaces]]
binding = "KV"

# The API key is a secret, never a var:  npx wrangler secret put ANTHROPIC_API_KEY
